<!-- DOCORA -->
<!DOCTYPE html>
<html lang="es">

<head>
    <!-- TITULO -->
    <title>Docora | Burocracia AI</title>

    <!-- CODIFICACIÓN Y OTROS -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FUENTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="docora.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- MAIN PAGE -->
    <div class="container">
        <!-- BOTÓN TEMA -->
        <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">
            <i class="fa-solid fa-sun"></i>
        </button>

        <!-- CABECERA -->
        <header class="hero">
            <div class="logo-container">
                <img src="../assets/logo.PNG" class="brand-logo" alt="Aurevia Labs">
            </div>

            <div class="hero-content">
                <h2>Tu burocracia.</h2>
                <div class="caja-rotatoria">
                    <div class="palabras">
                        <div class="palabra p1">Explicada</div>
                        <div class="palabra p2">Sencilla</div>
                        <div class="palabra p3">Sin prisa</div>
                        <div class="palabra p4">Moderna</div>
                    </div>
                </div>
            </div>
        </header>


    </div>

    <!-- SCRIPT JS -->
    <script src="docora.js"></script>
</body>

</html>
